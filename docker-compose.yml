version: '3.8'

services:
  home-app:
    container_name: home_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_HTTP_PORT:-8181}:80"
      - "${HOST_HTTPS_PORT:-8543}:443"
    volumes:
      - "${HOST_DATA_DIR:-./data}:/data"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
